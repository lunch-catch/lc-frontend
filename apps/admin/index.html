<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('launch-catch-theme');
        const theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>런치캐치 관리자</title>
    <script>
      // 개발 사이트를 실제 서비스로 착각하지 않도록 탭 이름 앞에 환경을 붙인다
      // 실제 서비스 주소에서만 표시를 빼고, 그 밖의 주소(dev, Vercel 미리보기)는 모두 [DEV]로 둔다
      (() => {
        const { hostname } = window.location;
        if (hostname === 'admin.lunchcatch.com') return;
        const label = hostname === 'localhost' ? '[LOCAL]' : '[DEV]';
        document.title = `${label} ${document.title}`;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
