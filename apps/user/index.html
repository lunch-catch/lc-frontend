<!doctype html>
<html lang="ko" data-layout="mobile">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('launch-catch-theme');
        const theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- 아이폰 홈 화면에 추가할 때 쓰는 아이콘. 모서리는 아이폰이 알아서 둥글게 자른다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>런치캐치</title>
    <script>
      // 개발 사이트를 실제 서비스로 착각하지 않도록 탭 이름 앞에 환경을 붙인다
      // 실제 서비스 주소에서만 표시를 빼고, 그 밖의 주소(dev, Vercel 미리보기)는 모두 [DEV]로 둔다
      (() => {
        const { hostname } = window.location;
        if (
          hostname === 'lunchcatch.com' ||
          hostname === 'www.lunchcatch.com'
        ) {
          return;
        }
        const label = hostname === 'localhost' ? '[LOCAL]' : '[DEV]';
        document.title = `${label} ${document.title}`;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
