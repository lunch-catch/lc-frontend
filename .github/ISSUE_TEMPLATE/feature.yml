name: 기능 개발
description: 새 기능이나 API를 추가한다
title: "[Feat] "
labels: ["feat"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      description: 작업 대상 화면 또는 공용 컴포넌트 범위를 선택한다
      options:
        - admin
        - owner
        - user
        - shared
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업
      value: |
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫는가. 테스트도 항목에 넣는다
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 관련 이슈, 설계 문서, 논의 링크. 없으면 비워둔다
