name: 버그 신고
description: 동작이 잘못되었다
title: "[Fix] "
labels: ["fix"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      value: |
        1. 
        2. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작 / 실제 동작
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: local / dev / prod, 브랜치나 커밋

  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: 스택 트레이스나 에러 메시지. 붙이면 코드 블록으로 감싼다
      render: text
